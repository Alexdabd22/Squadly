# CI/CD запускається тільки при push в main
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

stages:
  - build
  - test
  - docker

# ===== BUILD STAGE =====

backend_build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd backend
    - dotnet restore
    - dotnet build --configuration Release --no-restore
  cache:
    paths:
      - backend/.nuget/
  artifacts:
    paths:
      - backend/Squadly.API/bin/Release/
    expire_in: 1 hour

frontend_build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  cache:
    paths:
      - frontend/node_modules/
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# ===== TEST STAGE =====

backend_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  needs: [backend_build]
  script:
    - cd backend
    - dotnet test --configuration Release --no-build

frontend_lint:
  stage: test
  image: node:20-alpine
  needs: [frontend_build]
  script:
    - cd frontend
    - npm run lint

# ===== DOCKER STAGE =====

docker_build_backend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  needs: [backend_test]
  script:
    - docker build -t squadly-backend:latest ./backend
  only:
    - main

docker_build_frontend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  needs: [frontend_lint]
  script:
    - docker build -t squadly-frontend:latest ./frontend
  only:
    - main